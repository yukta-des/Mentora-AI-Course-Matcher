{% extends 'base.html' %}

{% block title %}Sign In — Mentora AI{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">

    <div class="bg-white border border-mentoraBorder rounded-3xl p-8 sm:p-10 space-y-6 shadow-sm">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-full bg-mentoraGreen text-white font-serif text-2xl font-bold flex items-center justify-center mx-auto">
                M
            </div>
            <h1 class="font-serif text-3xl font-bold text-mentoraGreen">Welcome Back</h1>
            <p class="text-xs text-mentoraTextMuted">Sign in to save courses and access your personal AI learning roadmap.</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-mentoraGreen mb-1.5">Email Address</label>
                <input type="email" name="email" required placeholder="you@example.com" 
                    class="w-full px-4 py-3 rounded-xl border border-mentoraBorder text-sm focus:outline-none focus:ring-2 focus:ring-mentoraGreen/20 focus:border-mentoraGreen">
            </div>

            <div>
                <label class="block text-xs font-bold text-mentoraGreen mb-1.5">Password</label>
                <input type="password" name="password" required placeholder="••••••••" 
                    class="w-full px-4 py-3 rounded-xl border border-mentoraBorder text-sm focus:outline-none focus:ring-2 focus:ring-mentoraGreen/20 focus:border-mentoraGreen">
            </div>

            <button type="submit" class="w-full py-3.5 bg-mentoraGreen text-white font-bold text-sm rounded-xl hover:bg-mentoraGreenLight transition-all shadow-md">
                Sign In
            </button>
        </form>

        <div class="relative flex py-2 items-center">
            <div class="flex-grow border-t border-mentoraBorder"></div>
            <span class="flex-shrink mx-4 text-xs text-mentoraTextMuted font-medium">or continuation with</span>
            <div class="flex-grow border-t border-mentoraBorder"></div>
        </div>

        <!-- Google Sign-in demo button -->
        <button onclick="alert('Google OAuth sign-in integration enabled in production!')" class="w-full py-3 border border-mentoraBorder rounded-xl flex items-center justify-center gap-3 text-xs font-bold text-mentoraGreen hover:bg-mentoraBadgeBg transition-all">
            <svg class="w-4 h-4" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Sign in with Google
        </button>

        <p class="text-center text-xs text-mentoraTextMuted pt-2">
            Don't have an account? <a href="{{ url_for('register') }}" class="font-bold text-mentoraGreen hover:underline">Create Account</a>
        </p>
    </div>

</div>
{% endblock %}
